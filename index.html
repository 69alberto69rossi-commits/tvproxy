<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; background:#000; }
iframe { width:100vw; height:100vh; border:none; }
</style>
</head>
<body>
<iframe id="player" allowfullscreen allow="autoplay"></iframe>
<script>
var params = new URLSearchParams(window.location.search);
var v = params.get("v");
var list = params.get("list");
var src = "https://www.youtube-nocookie.com/embed/";

if(v && list) {
    src += v + "?list=" + list + "&autoplay=1&controls=1&fs=1&rel=0";
} else if(list) {
    src += "videoseries?list=" + list + "&autoplay=1&controls=1&fs=1&rel=0";
} else if(v) {
    src += v + "?autoplay=1&controls=1&fs=1&rel=0";
}

document.getElementById("player").src = src;
</script>
</body>
</html>
